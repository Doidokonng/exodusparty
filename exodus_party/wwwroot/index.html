<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exodus Party - Live Room</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .neon-text {
            color: #1DB954;
            text-shadow: 0 0 15px #1DB954;
            font-size: 2.5em;
            text-transform: uppercase;
            margin: 0;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .coluna-esquerda {
            flex: 2;
        }

        .coluna-direita {
            flex: 1;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
        }

            .video-wrapper iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }

        #escudoEspectador {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }

        .painel {
            background-color: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

            .painel input {
                width: calc(50% - 15px);
                padding: 10px;
                margin: 5px;
                border-radius: 5px;
                border: none;
                background-color: #3d3d3d;
                color: white;
            }

            .painel button {
                background-color: #1DB954;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-weight: bold;
                width: 100%;
                margin-top: 10px;
            }

                .painel button:hover {
                    background-color: #1ed760;
                }

        .sugestao-item {
            background-color: #2d2d2d;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-tocar {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="neon-text" id="nomeDaParty">Carregando Sala...</h1>
        <p id="tituloMusica">Aguardando o Host soltar o som...</p>
    </div>

    <div class="container">
        <div class="coluna-esquerda">
            <div class="video-wrapper">
                <div id="ytPlayer"></div>
                <div id="escudoEspectador"></div>
            </div>

            <div class="painel" id="painelHost" style="display: none; border: 2px solid #ff4500;">
                <h3 style="margin-top:0; color: #ff4500;">👑 Controles do Host</h3>
                <input type="text" id="hostArtist" placeholder="Artista">
                <input type="text" id="hostTrack" placeholder="Música">
                <button onclick="dispararMusicaHost()">Tocar Imediatamente</button>
            </div>

            <div class="painel" id="painelEspectador">
                <h3 style="margin-top:0;">💡 Indicar Música</h3>
                <input type="text" id="specArtist" placeholder="Artista (ex: Kanye West)">
                <input type="text" id="specTrack" placeholder="Música (ex: Stronger)">
                <button onclick="enviarIndicacao()">Sugerir para o Host</button>
            </div>
        </div>

        <div class="coluna-direita">
            <h2 style="margin-top:0;">Fila de Indicações</h2>
            <div id="listaIndicacoes">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const partyId = parseInt(parametros.get("partyId"));
        const nomeParty = parametros.get("nome");
        const isHost = parametros.get("host") === "true";

        if (!partyId) window.location.href = "/host.html";
        else document.getElementById("nomeDaParty").innerText = "🎧 " + nomeParty + " 🎧";

        if (isHost) {
            document.getElementById("painelHost").style.display = "block";
            document.getElementById("escudoEspectador").style.display = "none";
            document.getElementById("painelEspectador").style.display = "none";
        }

        let player;
        let playerPronto = false;
        let videoPendente = null;

        const tagYT = document.createElement('script');
        tagYT.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tagYT, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                height: '405',
                width: '720',
                playerVars: { 'autoplay': 1, 'controls': isHost ? 1 : 0 },
                events: {
                    'onReady': aoPlayerFicarPronto,
                    'onStateChange': aoMudarEstadoDoPlayer
                }
            });
        }

        function aoPlayerFicarPronto(event) {
            playerPronto = true;
            if (videoPendente) {
                tocarVideoAPI(videoPendente.id, videoPendente.start);
            }
        }

        function aoMudarEstadoDoPlayer(event) {
            if (!isHost) return;

            if (event.data === YT.PlayerState.PAUSED) {
                connection.invoke("PausarVideo", partyId);
            } else if (event.data === YT.PlayerState.PLAYING) {
                connection.invoke("DarPlayVideo", partyId);
            }
        }

        function tocarVideoAPI(videoId, startSeconds = 0) {
            document.getElementById("tituloMusica").innerText = "Sincronizado e Tocando...";

            if (!playerPronto) {
                videoPendente = { id: videoId, start: startSeconds };
                return;
            }

            player.loadVideoById({ videoId: videoId, startSeconds: startSeconds });
        }


        const connection = new signalR.HubConnectionBuilder().withUrl("/partyhub").build();

        connection.on("ReceberNovaMusica", function (musica) {
            if (musica.partyId === partyId) {
                tocarVideoAPI(musica.youtubeVideoId, 0);
                document.getElementById("tituloMusica").innerText = `Tocando: ${musica.artistName} - ${musica.trackName}`;
            }
        });

        connection.on("ReceberComandoPause", function (idSala) {
            if (idSala === partyId && playerPronto && !isHost) {
                player.pauseVideo();
            }
        });

        connection.on("ReceberComandoPlay", function (idSala) {
            if (idSala === partyId && playerPronto && !isHost) {
                player.playVideo();
            }
        });

        connection.on("ReceberNovaIndicacao", function (sugestao) {
            if (sugestao.partyId === partyId) adicionarSugestaoNaTela(sugestao);
        });

        connection.on("RemoverIndicacaoDaTela", function (id) {
            const box = document.getElementById("sugestao-box-" + id);
            if (box) box.remove();
        });


        async function enviarIndicacao() {
            const artist = document.getElementById("specArtist").value;
            const track = document.getElementById("specTrack").value;
            if (!artist || !track) { alert("Preencha tudo!"); return; }

            const response = await fetch("/api/Suggestion", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ trackName: track, artistName: artist, partyId: partyId })
            });

            if (response.ok) {
                document.getElementById("specArtist").value = "";
                document.getElementById("specTrack").value = "";
            } else {
                const data = await response.json();
                alert("⚠️ " + data.message);
            }
        }

        async function dispararMusicaHost(trackName = null, artistName = null, suggestionId = null) {
            const artist = artistName || document.getElementById("hostArtist").value;
            const track = trackName || document.getElementById("hostTrack").value;
            if (!artist || !track) return;

            await fetch("/api/TrackHistory", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ trackName: track, artistName: artist, partyId: partyId })
            });

            if (suggestionId !== null) {
                await fetch(`/api/Suggestion/concluir/${suggestionId}`, { method: "PUT" });
                const box = document.getElementById("sugestao-box-" + suggestionId);
                if (box) box.remove();
            }
        }

        function adicionarSugestaoNaTela(sugestao) {
            const div = document.createElement("div");
            div.className = "sugestao-item";
            div.id = "sugestao-box-" + sugestao.id;

            let html = `<span><strong>${sugestao.artistName}</strong> - ${sugestao.trackName}</span>`;
            if (isHost) {
                html += `<button class="btn-tocar" onclick="dispararMusicaHost('${sugestao.trackName}', '${sugestao.artistName}', ${sugestao.id})">Tocar Agora</button>`;
            }
            div.innerHTML = html;
            document.getElementById("listaIndicacoes").appendChild(div);
        }

        async function carregarSala() {
            try {
                const resMusica = await fetch(`/api/TrackHistory/atual/${partyId}`);
                if (resMusica.ok) {
                    const musica = await resMusica.json();
                    document.getElementById("tituloMusica").innerText = `Tocando: ${musica.artistName} - ${musica.trackName}`;
                    const momentoInicio = new Date(musica.playedAt + (musica.playedAt.endsWith('Z') ? '' : 'Z'));
                    const segundos = Math.floor((new Date() - momentoInicio) / 1000);
                    tocarVideoAPI(musica.youtubeVideoId, segundos > 0 ? segundos : 0);
                }
            } catch (e) { }

            try {
                const resFila = await fetch(`/api/Suggestion/pendentes/${partyId}`);
                if (resFila.ok) {
                    const pendentes = await resFila.json();
                    pendentes.forEach(adicionarSugestaoNaTela);
                }
            } catch (e) { }
        }

        connection.start().then(carregarSala);
    </script>
</body>
</html>

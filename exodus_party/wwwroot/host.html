<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exodus Party - Home</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        .painel {
            background-color: #2d2d2d;
            padding: 40px;
            border-radius: 10px;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #3d3d3d;
            color: white;
            font-size: 1em;
        }

        button {
            background-color: #1DB954;
            color: white;
            padding: 15px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 95%;
            margin-top: 20px;
            font-size: 1.1em;
            transition: background-color 0.3s;
        }

            button:hover {
                background-color: #1ed760;
            }
    </style>
</head>
<body>

    <h1>Bem-vindo ao Exodus Party 🚀</h1>

    <div class="painel">
        <h2>Iniciar Nova Sessão</h2>

        <input type="text" id="partyName" placeholder="Nome da Party (ex: Coding & Chill)" required>
        <input type="text" id="playlistUrl" placeholder="Importar Playlist (URL Opcional)">

        <button id="btnCriar" onclick="criarParty()">Criar Party</button>
    </div>

    <script>
        async function criarParty() {
            const nomeInput = document.getElementById("partyName").value;
            const playlistInput = document.getElementById("playlistUrl").value;
            const botao = document.getElementById("btnCriar");

            if (!nomeInput || nomeInput.trim() === "") {
                alert("⚠️ Por favor, dê um nome para a sua Party!");
                return;
            }

            botao.innerText = "⏳ Criando sala...";
            botao.disabled = true;
            botao.style.backgroundColor = "#555";

            const payload = {
                name: nomeInput,
                playlistUrl: playlistInput
            };

            try {
                const resposta = await fetch("/api/Party", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (resposta.ok) {

                    const dados = await resposta.json();

                    const parametros = new URLSearchParams({
                        partyId: dados.partyId,
                        nome: dados.partyName
                    });

                    
                    window.location.href = "/index.html?" + parametros.toString();
                } else {
                    alert("❌ Falha ao criar a Party no servidor.");
                    restaurarBotao(botao);
                }
            } catch (erro) {
                alert("🔴 Servidor offline ou erro de conexão.");
                console.error(erro);
                restaurarBotao(botao);
            }
        }

        function restaurarBotao(botao) {
            botao.innerText = "Criar Party";
            botao.disabled = false;
            botao.style.backgroundColor = "#1DB954";
        }
    </script>
</body>
</html>
